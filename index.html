<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avventura con Spirit 🐎</title>
<style>
:root {
  --bg1: #fff7ec;
  --bg2: #dfc296;
  --brown: #5b3418;
  --brown2: #7a5548;
  --accent: #c98b2c;
  --accent-hover: #a96f1f;
  --card: #ffffff;
  --border: #e8dcc4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  color: var(--brown);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 760px;
  text-align: center;
}

h1 {
  margin: 0 0 8px;
  font-size: 32px;
}

.subtitle {
  margin: 0 0 32px;
  font-size: 18px;
  color: var(--brown2);
}

.choices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.choice {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 3px solid var(--border);
  border-radius: 18px;
  padding: 32px 20px;
  text-decoration: none;
  color: var(--brown);
  font-size: 22px;
  font-weight: bold;
  transition: 0.25s;
  cursor: pointer;
}

.choice:hover {
  border-color: var(--accent);
  background: #fff7e8;
  transform: translateY(-3px);
}

.choice .emoji {
  font-size: 56px;
  margin-bottom: 12px;
}

.choice .desc {
  font-size: 14px;
  font-weight: normal;
  color: var(--brown2);
  margin-top: 6px;
}

@media (max-width: 600px) {
  .choices { grid-template-columns: 1fr; }
  h1 { font-size: 26px; }
}
</style>
</head>
<body>

<div class="container">
  <h1>Avventura con Spirit 🐎</h1>
  <p class="subtitle">Scegli un quiz per iniziare</p>

  <div class="choices">
    <a class="choice" href="quiz_1.html">
      <div class="emoji">🐴</div>
      <div>Quiz 1</div>
      <div class="desc">Cosa sai su Spirit?</div>
    </a>
    <a class="choice" href="flashcard.html">
      <div class="emoji">🃏</div>
      <div>Flashcards</div>
      <div class="desc">Spirit: il cavallo selvaggio</div>
    </a>
    <a class="choice" href="questionario.html">
      <div class="emoji">📝</div>
      <div>Questionario</div>
      <div class="desc">Il viaggio di Babà</div>
    </a>
  </div>
</div>

</body>
</html>
